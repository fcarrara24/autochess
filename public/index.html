<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Battler Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            gap: 20px;
        }

        #gameContainer {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        #unitPanel {
            width: 200px;
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #444;
        }

        #unitPanel h3 {
            margin-top: 0;
            color: #4CAF50;
        }

        .unit-option {
            background-color: #3a3a3a;
            border: 2px solid #555;
            border-radius: 4px;
            padding: 10px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .unit-option:hover {
            background-color: #4a4a4a;
            border-color: #4CAF50;
        }

        .unit-option.selected {
            background-color: #4CAF50;
            border-color: #4CAF50;
            color: black;
        }

        .unit-stats {
            font-size: 12px;
            margin-top: 5px;
            color: #ccc;
        }

        #gameArea {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #gameInfo {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            min-width: 600px;
        }

        #gameCanvas {
            border: 3px solid #444;
            border-radius: 8px;
            background-color: #0a0a0a;
            cursor: crosshair;
        }

        #errorPopup {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #f44336;
            color: white;
            padding: 15px;
            border-radius: 8px;
            display: none;
            z-index: 1000;
            max-width: 300px;
        }

        #victoryPopup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            display: none;
            z-index: 2000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: victoryPulse 0.5s ease-in-out;
        }

        @keyframes victoryPulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        #connectionStatus {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: #2196F3;
            color: white;
            padding: 10px;
            border-radius: 8px;
            z-index: 1000;
        }

        #connectionStatus.connected {
            background-color: #4CAF50;
        }

        #connectionStatus.disconnected {
            background-color: #f44336;
        }

        .phase-indicator {
            font-weight: bold;
            color: #4CAF50;
        }

        .timer {
            color: #FF9800;
            font-weight: bold;
        }

        .scores {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }

        .player-score {
            background-color: #3a3a3a;
            padding: 8px 15px;
            border-radius: 4px;
        }

        .player-score.player-a {
            border: 2px solid #2196F3;
        }

        .player-score.player-b {
            border: 2px solid #f44336;
        }
    </style>
</head>
<body>
    <div id="connectionStatus">Connecting...</div>
    <div id="errorPopup"></div>
    <div id="victoryPopup">Hai vinto!</div>
    
    <div id="gameContainer">
        <div id="unitPanel">
            <h3>Units</h3>
            <div class="unit-option" data-unit-type="melee">
                <div>Melee Unit</div>
                <div class="unit-stats">HP: 30 | DMG: 10 | Range: 1</div>
            </div>
            <div class="unit-option" data-unit-type="ranged">
                <div>Ranged Unit</div>
                <div class="unit-stats">HP: 20 | DMG: 6 | Range: 2</div>
            </div>
        </div>
        
        <div id="gameArea">
            <div id="gameInfo">
                <div>Phase: <span class="phase-indicator" id="phase">PLACEMENT</span></div>
                <div>Time: <span class="timer" id="timer">30</span>s</div>
                <div>Round: <span id="round">1</span></div>
                <div class="scores">
                    <div class="player-score player-a">Player A: <span id="scoreA">0</span></div>
                    <div class="player-score player-b">Player B: <span id="scoreB">0</span></div>
                </div>
            </div>
            <canvas id="gameCanvas" width="640" height="240"></canvas>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
